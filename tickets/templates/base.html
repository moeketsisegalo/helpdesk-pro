{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HelpDesk Pro</title>

    <link rel="icon"
          type="image/png"
          href="{% static 'images/logo.png' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
          {% load static %}

    <link rel="stylesheet"
         href="{% static 'css/styles.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container-fluid">

    <div class="row">

        <!-- SIDEBAR -->

        <div class="col-md-2 bg-dark text-white min-vh-100">

            <div class="text-center mt-4 mb-4">

                <img src="{% static 'images/logo.png' %}"
                     alt="HelpDesk Pro"
                     class="img-fluid mb-2"
                     style="max-width: 180px;">

                <h5 class="mb-0">

                    HelpDesk Pro

                </h5>

                <small class="text-secondary">

                    Track Issues. Deliver Solutions.

                </small>

            </div>

            <hr class="text-secondary">

            <div class="nav flex-column">

                <a href="{% url 'dashboard' %}"
                   class="nav-link text-white py-2">

                    <i class="bi bi-speedometer2 me-2"></i>
                    Dashboard

                </a>

                <a href="{% url 'create_ticket' %}"
                   class="nav-link text-white py-2">

                    <i class="bi bi-plus-circle me-2"></i>
                    Create Ticket

                </a>

                <a href="{% url 'my_tickets' %}"
                   class="nav-link text-white py-2">

                    <i class="bi bi-ticket me-2"></i>
                    My Tickets

                </a>

                {% if request.user.is_staff %}

                <a href="{% url 'all_tickets' %}"
                   class="nav-link text-white py-2">

                    <i class="bi bi-list-check me-2"></i>
                    All Tickets

                </a>

                {% endif %}

            </div>

            <div class="mt-5">

                <form action="{% url 'logout' %}"
                      method="POST">

                    {% csrf_token %}

                    <button type="submit"
                            class="btn btn-danger btn-sm w-100">

                        <i class="bi bi-box-arrow-right me-1"></i>

                        Logout

                    </button>

                </form>

            </div>
            <button id="themeToggle"
            class="btn btn-outline-light btn-sm w-100 mt-3">
    
        🌙 Dark Mode
    
    </button>
        </div>

        <!-- MAIN CONTENT -->

        <div class="col-md-10">

            <div class="p-4">

                {% block content %}
                {% endblock %}

                <hr class="mt-5">

                <footer class="text-center text-muted">

                    <small>

                        Developed by TheDebuggers © 2026

                    </small>

                </footer>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>

    const toggleBtn = document.getElementById('themeToggle');
    
    const currentTheme =
        localStorage.getItem('theme');
    
    if(currentTheme === 'dark')
    {
        document.body.classList.add('bg-dark');
        document.body.classList.add('text-white');
    }
    
    toggleBtn.addEventListener('click', () => {
    
        // document.body.classList.toggle('bg-dark');
    
        // document.body.classList.toggle('text-white');
        document.body.classList.toggle('dark-mode');
        if(document.body.classList.contains('bg-dark'))
        {
            localStorage.setItem(
                'theme',
                'dark'
            );
        }
        else
        {
            localStorage.setItem(
                'theme',
                'light'
            );
        }
    
    });
    
    </script>
</body>

</html>
