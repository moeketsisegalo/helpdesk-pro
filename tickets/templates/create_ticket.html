{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">
    Create Ticket
</h2>

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">

        <label class="form-label">
            Title
        </label>

        {{ form.title }}

    </div>

    <div class="mb-3">

        <label class="form-label">
            Description
        </label>

        {{ form.description }}

    </div>

    <div class="mb-3">

        <label class="form-label">
            Priority
        </label>

        {{ form.priority }}

    </div>

    <button class="btn btn-primary">

        Submit Ticket

    </button>

</form>

{% endblock %}
